version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-tools:
        dependency-type: development
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types follow the runtime major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
