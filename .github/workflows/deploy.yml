name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild so past concerts drop off the list without a commit.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Site URL and base path come from the Pages settings (custom domain www.exhalace.cz).
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          build-cmd: |
            set -euo pipefail
            git diff --exit-code -- package.json package-lock.json
            npm audit --audit-level=high
            : "${SITE:?Missing Pages origin}"
            [[ "$SITE" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?/?$ ]] || { echo '::error::Invalid Pages origin'; exit 1; }
            npm run format:check
            npm run check
            npm run build -- --timings --site "$SITE" --base "${BASE:-/}"
            node scripts/check-output.mjs
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
