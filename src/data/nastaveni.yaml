organisers: |
  Nezbytnou podmínkou pro správnou funkci aparatury je bezpečná a dostatečně dimenzovaná elektrická přípojka v místě konání akce.

  K dispozici máme aparát pro ozvučení malých sálů nebo hospod. Pro venkovní akce nebo velké kulturáky si domlouváme externího zvukaře s jeho vybavením. Nebo si pořadatel může sám zajistit PA vybavení včetně zvukaře. To už záleží na konkrétní domluvě.

  Pódiový aparát včetně bicích si vozíme vlastní.

  Při venkovních akcích požadujeme zastřešené pódium – nemáme rádi mokro.

  Při vystoupení požadujeme dostatečné osvětlení členů kapely.

  Na všem se dá domluvit, je ale potřeba vše dohodnout předem.
